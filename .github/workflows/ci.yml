name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: erm
          POSTGRES_PASSWORD: erm
          POSTGRES_DB: erm_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U erm -d erm_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://erm:erm@localhost:5433/erm_test
      EMAIL_FROM: noreply@admin.imhogen.com
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test

  e2e:
    runs-on: ubuntu-latest
    # Chromium and its system packages come with the image, so the job never
    # downloads them from Ubuntu's servers. Keep the tag on the installed
    # @playwright/test version.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: erm
          POSTGRES_PASSWORD: erm
          POSTGRES_DB: erm_dev
        options: >-
          --health-cmd "pg_isready -U erm -d erm_dev"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # Inside a container the database is reached by its service name.
      DATABASE_URL: postgres://erm:erm@postgres:5432/erm_dev
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      # The checkout belongs to another user than the container's, and the
      # git hooks that install runs refuse such a folder unless told it is safe.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm install -g bun@1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun run db:seed
      - run: bun run test:e2e
