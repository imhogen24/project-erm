pre-commit:
  commands:
    encrypt-env:
      glob: ".env.development"
      run: bun run encrypt
      stage_fixed: true
    protect-env:
      run: bunx dotenvx protect
    format:
      glob: "*.{ts,tsx}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true
    lint:
      run: bun run lint
    typecheck:
      run: bun run typecheck
