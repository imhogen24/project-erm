pre-commit:
  commands:
    encrypt-env:
      glob: ".env.{development,production}"
      run: bun run encrypt
      stage_fixed: true
    protect-env:
      run: bunx dotenvx protect
    format:
      glob: "*.{ts,tsx}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true
    lint:
      run: bun run lint
    typecheck:
      run: bun run typecheck

# A rebase or merge from main replays commits without pre-commit, so code that
# passed alone can break once combined. Check again before it leaves.
pre-push:
  parallel: true
  commands:
    lint:
      run: bun run lint
    typecheck:
      run: bun run typecheck
